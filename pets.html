<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pets</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="section section-header section-header-pets">
            <div class="header-logo">
                <a href="" class="header-logo-links">
                    <h1 class="logo-title">Cozy House</h1>
                    <span class="logo-subtitle">Shelter for pets in Boston</span>
                </a>
            </div>
            <nav>
                <ul class="nav-list">
                    <li class="nav-item"><a href="" class="nav-link">About the shelter</a></li>
                    <li class="nav-item"><a href="" class="nav-link nav-link-active">Our pets</a></li>
                    <li class="nav-item"><a href="" class="nav-link">Help the shelter</a></li>
                    <li class="nav-item"><a href="" class="nav-link">Contacts</a></li>
                </ul>
                <div class="burger-menu"></div>
            </nav>
        </div>
    </header>
    <main>
        <div class="section section-pets section-pets-page">
            <h3>Our friends who<br>are looking for a house</h3>
            <div class="slider slider-pets">
                <div class="slider-item">
                    <div class="slider-img">
                        <img src="./assets/png/pets-katrine.png" alt="katrine">
                    </div>
                    <span class="pets-name">Katrine</span>
                    <button class="button-secondary">Learn more</button>
                </div>
                <div class="slider-item">
                    <div class="slider-img">
                        <img src="./assets/png/pets-jennifer.png" alt="jennifer">
                    </div>
                    <span class="pets-name">Jennifer</span>
                    <button class="button-secondary">Learn more</button>
                </div>
                <div class="slider-item">
                    <div class="slider-img">
                        <img src="./assets/png/pets-woody.png" alt="woody">
                    </div>
                    <span class="pets-name">Woody</span>
                    <button class="button-secondary">Learn more</button>
                </div>
                <div class="slider-item">
                    <div class="slider-img">
                        <img src="./assets/png/pets-sophia.png" alt="sophia">
                    </div>
                    <span class="pets-name">Sophia</span>
                    <button class="button-secondary">Learn more</button>
                </div>
                <div class="slider-item">
                    <div class="slider-img">
                        <img src="./assets/png/pets-timmy.png" alt="timmy">
                    </div>
                    <span class="pets-name">Timmy</span>
                    <button class="button-secondary">Learn more</button>
                </div>
                <div class="slider-item">
                    <div class="slider-img">
                        <img src="./assets/png/pets-charly.png" alt="charly">
                    </div>
                    <span class="pets-name">Charly</span>
                    <button class="button-secondary">Learn more</button>
                </div>
                <div class="slider-item">
                    <div class="slider-img">
                        <img src="./assets/png/pets-scarlet.png" alt="scarlett">
                    </div>
                    <span class="pets-name">Scarlett</span>
                    <button class="button-secondary">Learn more</button>
                </div>
                <div class="slider-item">
                    <div class="slider-img">
                        <img src="./assets/png/pets-freddie.png" alt="freddie">
                    </div>
                    <span class="pets-name">Freddie</span>
                    <button class="button-secondary">Learn more</button>
                </div>
            </div>
            <!--<div class="slider-buttons">
                <button class="slider-button slider-button-prev">&larr;</button>
                <button class="slider-button slider-button-next">&rarr;</button>
            </div>-->
        </div>
    </main>
</body>
</html>
